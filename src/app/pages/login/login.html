<div class="login-container">

  <h1>vCloud</h1>

  <h2>Entre na sua conta</h2>

  <input
    id="email"
    type="email"
    placeholder="E-mail"
    [(ngModel)]="email"
  />

  <input
    id="password"
    type="password"
    placeholder="Senha"
    [(ngModel)]="password"
  />

  <button (click)="login()">
    Entrar
  </button>

</div>
