<div class="login-container">

  <div class="login-header">
    <h1>vCloud</h1>
    <h2>Entre na sua conta</h2>
  </div>

  <div class="login-form">

    <input
      id="email"
      name="email"
      type="email"
      placeholder="E-mail"
      [(ngModel)]="email"
    />

    <input
      id="password"
      name="password"
      type="password"
      placeholder="Senha"
      [(ngModel)]="password"
    />

    <button (click)="login()">
      Entrar
    </button>

  </div>

  <p class="register-link">
    Ainda não possui uma conta?
    <a routerLink="/register">Criar conta</a>
  </p>

</div>
